name: Repair combined MCP test

on:
  push:
    branches:
      - integration/public-reference-fetch

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'chore: run guarded MCP test repair'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: integration/public-reference-fetch

      - name: Restore and reconcile MCP test exactly
        shell: bash
        run: |
          set -euo pipefail
          good=f40ef706890d4fabb0cd8dbdc510a18565cb13ad
          git checkout "$good" -- test/mcp.test.ts
          python3 <<'PY'
          from pathlib import Path

          path = Path('test/mcp.test.ts')
          text = path.read_text()
          replacements = [
              (
                  "expect(names).toEqual(['agents', 'apply_patch', 'exec_command', 'local_github', 'read', 'session', 'view_image', 'write_stdin']);",
                  "expect(names).toEqual(['agents', 'apply_patch', 'exec_command', 'local_github', 'read', 'reference_web', 'session', 'view_image', 'write_stdin']);",
              ),
              (
                  "expect(coreTools).toHaveLength(8);",
                  "expect(coreTools).toHaveLength(9);",
              ),
              (
                  "expect(toolNames(await core('tools/list'))).toEqual(['find', 'read', 'view_image']);",
                  "expect(toolNames(await core('tools/list'))).toEqual(['find', 'read', 'reference_web', 'view_image']);",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'STOP: expected exactly one match for {old!r}, got {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git diff --check
          numstat="$(git diff --numstat "$good" -- test/mcp.test.ts)"
          test "$numstat" = $'3\t3\ttest/mcp.test.ts' || {
            echo "STOP: unexpected MCP test diff stats: $numstat"
            git diff --unified=1 "$good" -- test/mcp.test.ts
            exit 1
          }
          git diff --unified=1 "$good" -- test/mcp.test.ts

      - name: Commit guarded repair and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-mcp-integration.yml
          git add test/mcp.test.ts
          git diff --cached --check
          git commit -m 'M2 integration: restore and reconcile MCP surface assertions'
          git push origin HEAD:integration/public-reference-fetch

name: Public release publishing (disabled until M4)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse public publication before provenance milestone
        run: |
          echo "Public release publishing is intentionally disabled for the current hardened baseline." >&2
          echo "Use the Linux M0 test candidate artifact for controlled testing." >&2
          echo "Public publishing returns only after the release-provenance/signing milestone defines its acceptance gates." >&2
          exit 1

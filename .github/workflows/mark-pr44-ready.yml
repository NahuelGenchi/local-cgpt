name: Mark PR 44 ready

on:
  push:
    branches:
      - integration/public-reference-fetch

permissions:
  contents: write
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: integration/public-reference-fetch

      - name: Mark PR 44 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 44 --repo NahuelGenchi/local-cgpt

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mark-pr44-ready.yml
          git commit -m 'chore: remove temporary PR-ready workflow'
          git push origin HEAD:integration/public-reference-fetch

name: Review dependency preparation

# Temporary review-only job for #82. Remove from the final maintenance diff.
on:
  pull_request:
    paths:
      - '.github/workflows/review-preparation.yml'

permissions:
  contents: read

jobs:
  prepare:
    # The only write is a forward commit of two reviewed, hash-pinned generated files.
    # No token is passed to npm and checkout never persists credentials.
    permissions:
      contents: write
    if: github.repository == 'NahuelGenchi/local-cgpt' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/review-dependency-remediation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Regenerate only the already reviewed dependency files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-evidence"
          npm install --package-lock-only --ignore-scripts --save-exact sharp@0.35.4
          npm update hono --package-lock-only --ignore-scripts
          test "$(git hash-object package.json)" = a56bbeebffcc05aa24b2a46303fb3ca4534de41e
          test "$(git hash-object package-lock.json)" = 5832b87a2c9732a33f9b1460f82b4653fa743542
          test "$(git diff --name-only)" = $'package-lock.json\npackage.json'
          cp package.json package-lock.json "$RUNNER_TEMP/review-evidence/"
          git diff -- package.json package-lock.json > "$RUNNER_TEMP/review-evidence/dependencies.diff"
          npm audit --omit=dev --audit-level=high --json > "$RUNNER_TEMP/review-evidence/production-audit.json"
      - name: Commit reviewed files only to the isolated maintenance branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/work/review-dependency-remediation | awk '{print $1}')" = "$EXPECTED_HEAD"
          git add -- package.json package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): pin sharp 0.35.4 and refresh compatible Hono lock (#82)'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/work/review-dependency-remediation
          git rev-parse HEAD > "$RUNNER_TEMP/review-evidence/generated-commit.txt"
      - name: Upload public dependency evidence, never a release
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-preparation-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/review-evidence/
          if-no-files-found: error
          retention-days: 3

name: Legacy release candidate (disabled)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse unsupported legacy release pipeline
        run: |
          echo "The inherited cross-platform release pipeline is disabled." >&2
          echo "local-cgpt currently supports Linux only. Use the Linux M0 test candidate workflow for controlled testing." >&2
          echo "A public release pipeline will be reintroduced under the release-provenance milestone." >&2
          exit 1

name: Maintainer patch

on:
  push:
    branches:
      - security/hardened-baseline
    paths:
      - .github/workflows/maintainer-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: security/hardened-baseline
          persist-credentials: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Apply test-harness and fail-closed fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          config = Path('src/main/config.ts')
          text = config.read_text()
          old = """    capabilities: { ...DEFAULT_CAPABILITIES },\n    readOnly: true,"""
          new = """    capabilities: { ...FIRST_LAUNCH_CAPABILITIES },\n    readOnly: true,"""
          if old not in text:
              raise SystemExit('conservative recovery capability block not found')
          text = text.replace(old, new, 1)

          marker = """export function getConfig(): Config {\n  return current;\n}\n"""
          replacement = marker + """\n/** Test harness only: installs an explicit opted-in config without touching disk. */\nexport function setConfigForTests(next: Config): void {\n  if (process.env.VITEST !== 'true') {\n    throw new Error('setConfigForTests is available only under Vitest');\n  }\n  current = next;\n}\n"""
          if marker not in text:
              raise SystemExit('getConfig marker not found')
          text = text.replace(marker, replacement, 1)
          config.write_text(text)

          Path('test/setup-config.ts').write_text("""import { beforeEach } from 'vitest';\nimport { defaultConfig, setConfigForTests } from '../src/main/config.js';\nimport { capabilitiesForPlatform } from '../src/main/platform.js';\nimport { CAPABILITIES, type Capabilities } from '../src/shared/types.js';\n\n/**\n * Most behavioral tests exercise features after the user has deliberately enabled them.\n * Keep that state explicit so production first-launch defaults can remain fail-closed.\n */\nfunction optedInTestConfig() {\n  const base = defaultConfig();\n  const granted = Object.fromEntries(CAPABILITIES.map((capability) => [capability, true])) as Capabilities;\n  return {\n    ...base,\n    capabilities: capabilitiesForPlatform(granted),\n    readOnly: false,\n    sessions: { ...base.sessions, record: true },\n    compaction: { ...base.compaction, auto: true },\n    multiAgent: { ...base.multiAgent, enabled: true }\n  };\n}\n\nbeforeEach(() => {\n  setConfigForTests(optedInTestConfig());\n});\n""")

          Path('vitest.config.ts').write_text("""import { defineConfig } from 'vitest/config';\n\nexport default defineConfig({\n  test: {\n    setupFiles: ['./test/setup-config.ts']\n  }\n});\n""")

          mcp = Path('test/mcp.test.ts')
          text = mcp.read_text()
          pattern = re.compile(r"  it\('starts a fresh install with every capability effective', \(\) => \{.*?\n  \}\);", re.S)
          replacement = """  it('starts a fresh install with no model-facing capability effective', () => {\n    const config = defaultConfig('win32');\n    expect(config.readOnly).toBe(true);\n    expect(config.multiAgent.enabled).toBe(false);\n    expect(Object.values(effectiveCapabilities(config, 'win32')).every((enabled) => !enabled)).toBe(true);\n  });"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'mcp fresh-install test replacement count={count}')
          mcp.write_text(text)

          Path('test/platform.test.ts').write_text("""import { describe, expect, it } from 'vitest';\nimport { defaultConfig, effectiveCapabilities } from '../src/main/config.js';\nimport { capabilitiesForPlatform, desktopAutomationSupported, hostPlatformInfo } from '../src/main/platform.js';\nimport { surfaceIsUseful } from '../src/main/mcp/surfaces.js';\nimport { serverInstructions } from '../src/main/mcp/instructions.js';\nimport { unifiedExecEnvForPlatform } from '../src/main/codex/unified-exec-constants.js';\nimport type { Capabilities } from '../src/shared/types.js';\n\nconst allCapabilities = (): Capabilities => ({\n  browse: true,\n  search: true,\n  read: true,\n  metadata: true,\n  create: true,\n  edit: true,\n  move: true,\n  deleteFile: true,\n  command: true,\n  screen: true,\n  control: true,\n  clipboardRead: true,\n  clipboardWrite: true\n});\n\ndescribe('cross-platform product surface', () => {\n  it.each(['darwin', 'linux'] as const)('starts Core inert while still omitting Desktop on %s', (platform) => {\n    const config = defaultConfig(platform);\n    expect(Object.values(config.capabilities).every((enabled) => !enabled)).toBe(true);\n    expect(config.readOnly).toBe(true);\n    expect(surfaceIsUseful('core', config.capabilities, platform)).toBe(false);\n    expect(surfaceIsUseful('core', capabilitiesForPlatform(allCapabilities(), platform), platform)).toBe(true);\n    expect(surfaceIsUseful('desktop', allCapabilities(), platform)).toBe(false);\n  });\n\n  it('masks stored Windows Desktop grants at runtime without deleting the stored choices', () => {\n    const stored = allCapabilities();\n    const config = { ...defaultConfig('linux'), capabilities: stored, readOnly: false };\n    const live = effectiveCapabilities(config, 'linux');\n\n    expect(live.screen).toBe(false);\n    expect(live.control).toBe(false);\n    expect(live.clipboardRead).toBe(false);\n    expect(live.clipboardWrite).toBe(false);\n    expect(live.command).toBe(true);\n    expect(config.capabilities).toBe(stored);\n    expect(config.capabilities.screen).toBe(true);\n  });\n\n  it('reports the host family and Desktop support explicitly', () => {\n    expect(hostPlatformInfo('win32')).toEqual({ family: 'windows', name: 'Windows', desktopAutomation: true });\n    expect(hostPlatformInfo('darwin')).toEqual({ family: 'macos', name: 'macOS', desktopAutomation: false });\n    expect(hostPlatformInfo('linux')).toEqual({ family: 'linux', name: 'Linux', desktopAutomation: false });\n    expect(desktopAutomationSupported('freebsd')).toBe(false);\n    expect(capabilitiesForPlatform(allCapabilities(), 'win32')).toEqual(allCapabilities());\n  });\n\n  it.each(['darwin', 'linux'] as const)('teaches POSIX shell semantics instead of Windows guidance on %s', (platform) => {\n    const instructions = serverInstructions(\n      {\n        roots: [],\n        caps: allCapabilities(),\n        readOnly: false,\n        sessionTools: false,\n        agentTools: false\n      },\n      'core',\n      platform\n    );\n\n    expect(instructions).toContain(platform === 'darwin' ? 'Local macOS coding bridge' : 'Local Linux coding bridge');\n    expect(instructions).toContain('normal POSIX shell');\n    expect(instructions).not.toMatch(/PowerShell|Get-ChildItem|Windows desktop|Native Windows paths/);\n    expect(instructions).not.toContain('Chat On Steroids Desktop');\n  });\n\n  it('retains the Windows-specific shell guidance on Windows', () => {\n    const instructions = serverInstructions(\n      { roots: [], caps: allCapabilities(), readOnly: false, sessionTools: false, agentTools: false },\n      'core',\n      'win32'\n    );\n    expect(instructions).toContain('Local Windows coding bridge');\n    expect(instructions).toContain('PowerShell does not expand');\n    expect(instructions).toContain('Chat On Steroids Desktop');\n  });\n\n  it('uses a UTF-8 locale name native to each POSIX host', () => {\n    const environment = (platform: NodeJS.Platform) => new Map(unifiedExecEnvForPlatform(platform));\n    expect(environment('linux').get('LC_ALL')).toBe('C.UTF-8');\n    expect(environment('darwin').get('LC_ALL')).toBe('en_US.UTF-8');\n  });\n});\n""")

          Path('test/feature-parity.test.ts').write_text("""import { readFileSync } from 'node:fs';\nimport { describe, expect, it } from 'vitest';\nimport { defaultConfig } from '../src/main/config.js';\nimport { surfaceDefinition, surfaceIsUseful } from '../src/main/mcp/surfaces.js';\nimport { browserExtensionRequired } from '../src/shared/types.js';\n\ndescribe('portable browser-backed feature parity', () => {\n  it.each(['win32', 'darwin', 'linux'] as const)(\n    'keeps privacy-first feature policy platform-invariant on %s',\n    (platform) => {\n      const config = defaultConfig(platform);\n      const windows = defaultConfig('win32');\n\n      expect(surfaceIsUseful('core', config.capabilities, platform)).toBe(false);\n      expect(config.sessions.record).toBe(false);\n      expect(config.compaction.auto).toBe(false);\n      expect(config.compaction.autoTokens).toBe(config.sessions.advisoryTokens);\n      expect(config.goal).toEqual(windows.goal);\n      expect(config.goal.enabled).toBe(false);\n      expect(config.multiAgent).toEqual({ enabled: false, maxWorkers: 2 });\n      expect(browserExtensionRequired(config)).toBe(false);\n    }\n  );\n\n  it('keeps the bridge required for either independently viable browser feature', () => {\n    const config = defaultConfig('darwin');\n\n    expect(\n      browserExtensionRequired({\n        sessions: { ...config.sessions, record: false },\n        multiAgent: { ...config.multiAgent, enabled: true }\n      })\n    ).toBe(true);\n    expect(\n      browserExtensionRequired({\n        sessions: { ...config.sessions, record: true },\n        multiAgent: { ...config.multiAgent, enabled: false }\n      })\n    ).toBe(true);\n    expect(\n      browserExtensionRequired({\n        sessions: { ...config.sessions, record: false },\n        multiAgent: { ...config.multiAgent, enabled: false }\n      })\n    ).toBe(false);\n  });\n\n  it('ships the complete Core/browser product on macOS while leaving permissions ungranted', () => {\n    const config = defaultConfig('darwin');\n    expect(surfaceDefinition('core').tools).toEqual([\n      'read',\n      'view_image',\n      'find',\n      'apply_patch',\n      'exec_command',\n      'write_stdin',\n      'session',\n      'agents'\n    ]);\n    expect(surfaceIsUseful('core', config.capabilities, 'darwin')).toBe(false);\n    expect(surfaceIsUseful('desktop', config.capabilities, 'darwin')).toBe(false);\n\n    const manifest = JSON.parse(\n      readFileSync(new URL('../extension/manifest.json', import.meta.url), 'utf8')\n    ) as { host_permissions?: string[] };\n    expect(manifest.host_permissions).toEqual(\n      expect.arrayContaining([\n        'https://chatgpt.com/*',\n        'http://127.0.0.1:8765/*',\n        'http://127.0.0.1:8766/*',\n        'http://127.0.0.1:8767/*',\n        'http://127.0.0.1:8768/*',\n        'http://127.0.0.1:8769/*'\n      ])\n    );\n  });\n});\n""")

      - name: Install dependencies
        run: npm ci

      - name: Validate patch
        run: |
          npm run typecheck
          npx vitest run test/config.test.ts test/platform.test.ts test/feature-parity.test.ts test/mcp.test.ts test/agents.test.ts test/bridge.test.ts test/continuation.test.ts test/session.test.ts test/mcp-inflight.test.ts test/exec-output-budget-mcp.test.ts

      - name: Commit patch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/config.ts test/setup-config.ts vitest.config.ts test/mcp.test.ts test/platform.test.ts test/feature-parity.test.ts
          git commit -m "test: make feature opt-in explicit"
          git push origin HEAD:security/hardened-baseline

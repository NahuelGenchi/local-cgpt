name: Separate hardened Linux package identity

on:
  workflow_dispatch:
  push:
    branches: [security/hardened-baseline]
    paths:
      - '.github/workflows/maintainer-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: security/hardened-baseline
          persist-credentials: true

      - name: Separate package, executable and desktop identity
        shell: python
        run: |
          from pathlib import Path

          package = Path('package.json')
          text = package.read_text()
          replacements = {
              '"name": "chat-on-steroids"': '"name": "local-cgpt"',
              '"desktopName": "com.chatonsteroids.app.desktop"': '"desktopName": "com.localcgpt.app.desktop"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'package.json anchor changed: {old}')
              text = text.replace(old, new, 1)
          package.write_text(text)

          lock = Path('package-lock.json')
          text = lock.read_text()
          old = '"name": "chat-on-steroids"'
          if text.count(old) != 2:
              raise SystemExit(f'expected exactly two package-lock root names, found {text.count(old)}')
          lock.write_text(text.replace(old, '"name": "local-cgpt"'))

          builder = Path('electron-builder.yml')
          text = builder.read_text()
          replacements = {
              'appId: com.chatonsteroids.app': 'appId: com.localcgpt.app',
              '  executableName: chat-on-steroids': '  executableName: local-cgpt',
              '  artifactName: Chat-On-Steroids-Linux-${env.COS_PACKAGE_ARCH}.${ext}': '  artifactName: Local-CGPT-Linux-${env.COS_PACKAGE_ARCH}.${ext}',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'electron-builder anchor changed: {old}')
              text = text.replace(old, new, 1)
          builder.write_text(text)

          workflow = Path('.github/workflows/linux-test-build.yml')
          text = workflow.read_text()
          replacements = {
              'Chat-On-Steroids-Linux-x64.deb': 'Local-CGPT-Linux-x64.deb',
              '= chat-on-steroids': '= local-cgpt',
              "dpkg-query -W -f='${Status}\\n' chat-on-steroids": "dpkg-query -W -f='${Status}\\n' local-cgpt",
              '/usr/bin/chat-on-steroids': '/usr/bin/local-cgpt',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'candidate workflow anchor missing: {old}')
              text = text.replace(old, new)
          workflow.write_text(text)

          test_doc = Path('docs/linux-m0-test.md')
          text = test_doc.read_text()
          old = 'Chat-On-Steroids-Linux-x64.deb'
          if text.count(old) < 2:
              raise SystemExit('Linux M0 test artifact references changed unexpectedly')
          test_doc.write_text(text.replace(old, 'Local-CGPT-Linux-x64.deb'))

      - name: Validate and commit
        run: |
          npm ci
          node -e "const p=require('./package.json'); if(p.name!=='local-cgpt'||p.desktopName!=='com.localcgpt.app.desktop') process.exit(2)"
          grep -Fxq 'appId: com.localcgpt.app' electron-builder.yml
          grep -Fxq '  executableName: local-cgpt' electron-builder.yml
          grep -Fq 'Local-CGPT-Linux-${env.COS_PACKAGE_ARCH}.${ext}' electron-builder.yml
          npm run typecheck
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json electron-builder.yml .github/workflows/linux-test-build.yml docs/linux-m0-test.md
          git diff --cached --quiet || git commit -m "security: separate hardened Linux package identity"
          git push origin HEAD:security/hardened-baseline

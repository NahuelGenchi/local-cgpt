name: Maintainer patch

on:
  push:
    branches:
      - security/hardened-baseline
    paths:
      - .github/workflows/maintainer-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: security/hardened-baseline
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Patch command path and explicit fixtures
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return
              if new not in text:
                  raise SystemExit(f'{label}: neither old nor new form found')

          replace_once(
              'test/bridge.test.ts',
              """      sessions: { ...defaultConfig().sessions, record: true },\n      goal: { ...defaultConfig().goal, enabled: true, model: 'deepseek/deepseek-v4-flash', reasoning: 'default' }""",
              """      sessions: { ...defaultConfig().sessions, record: true },\n      multiAgent: { ...defaultConfig().multiAgent, enabled: true, maxWorkers: 3 },\n      goal: { ...defaultConfig().goal, enabled: true, model: 'deepseek/deepseek-v4-flash', reasoning: 'default' }""",
              'bridge Goal config'
          )
          replace_once(
              'test/mcp.test.ts',
              """    expect(textOf(second)).not.toContain('first=raw-no-newline');\n  });\n\n  it('runs in workdir and omits the old connector-specific cwd header'""",
              """    expect(textOf(second)).not.toContain('first=raw-no-newline');\n  }, 30_000);\n\n  it('runs in workdir and omits the old connector-specific cwd header'""",
              'mcp timeout'
          )
          replace_once(
              'test/session.test.ts',
              """    expect(call?.attributionMethod).toBe('unattributed');\n    expect(call?.conversationId).toBeNull();\n  });\n\n  /**\n   * A disagreement is a bad moment, not a bad request id.""",
              """    expect(call?.attributionMethod).toBe('unattributed');\n    expect(call?.conversationId).toBeNull();\n  }, 30_000);\n\n  /**\n   * A disagreement is a bad moment, not a bad request id.""",
              'session timeout'
          )

          tools = Path('src/main/mcp/tools-core.ts')
          text = tools.read_text()
          import_old = """import { childEnv } from '../exec.js';\nimport { locateRipgrep } from '../ripgrep.js';"""
          import_new = """import { childEnv } from '../exec.js';\nimport { sandboxCommandLaunch } from '../command-sandbox.js';\nimport { locateRipgrep } from '../ripgrep.js';"""
          if import_old in text:
              text = text.replace(import_old, import_new, 1)
          elif import_new not in text:
              raise SystemExit('tools-core sandbox import anchor missing')

          rg_old = """          const commandNotes: string[] = [];\n          const boundCommands = rawCommands.map((rawCommand, index) => {"""
          rg_new = """          const commandNotes: string[] = [];\n          const bundledRipgrep = shell.shellType === 'cmd' ? null : locateRipgrep();\n          const boundCommands = rawCommands.map((rawCommand, index) => {"""
          if rg_old in text:
              text = text.replace(rg_old, rg_new, 1)
          elif rg_new not in text:
              raise SystemExit('tools-core rg setup anchor missing')

          locate_old = """              shell.shellType,\n              shell.shellType === 'cmd' ? null : locateRipgrep()\n            );"""
          locate_new = """              shell.shellType,\n              bundledRipgrep\n            );"""
          if locate_old in text:
              text = text.replace(locate_old, locate_new, 1)
          elif locate_new not in text:
              raise SystemExit('tools-core rg bind anchor missing')

          call_old = """            const output = await unifiedExecManager.execCommand({\n              command,\n              shellType: shell.shellType,\n              hookCommand: commandDetail,\n              processId,\n              yieldTimeMs: input.yield_time_ms ?? DEFAULT_EXEC_YIELD_TIME_MS,\n              maxOutputTokens: input.max_output_tokens,\n              truncationPolicy: EXEC_OUTPUT_CEILING_POLICY,\n              cwd: dir.real,\n              displayCwd: dir.virtual,\n              env: execChildEnvironment(),\n              tty: input.tty ?? DEFAULT_TTY\n            });"""
          call_new = """            const launch = sandboxCommandLaunch({\n              command,\n              cwd: dir.real,\n              roots: ctx.roots,\n              env: execChildEnvironment(),\n              runtimeReadPaths: bundledRipgrep ? [bundledRipgrep] : []\n            });\n            const output = await unifiedExecManager.execCommand({\n              command: launch.command,\n              shellType: shell.shellType,\n              hookCommand: commandDetail,\n              processId,\n              yieldTimeMs: input.yield_time_ms ?? DEFAULT_EXEC_YIELD_TIME_MS,\n              maxOutputTokens: input.max_output_tokens,\n              truncationPolicy: EXEC_OUTPUT_CEILING_POLICY,\n              cwd: launch.cwd,\n              displayCwd: dir.virtual,\n              env: launch.env,\n              tty: input.tty ?? DEFAULT_TTY\n            });"""
          if call_old in text:
              text = text.replace(call_old, call_new, 1)
          elif call_new not in text:
              raise SystemExit('tools-core exec anchor missing')
          tools.write_text(text)
      - name: Install dependencies
        run: npm ci
      - name: Stage ripgrep
        run: npm run rg
      - name: Validate command containment and changed fixtures
        run: |
          npm run typecheck
          npx vitest run test/command-sandbox.test.ts --maxWorkers=1
          npx vitest run test/bridge.test.ts -t "the goal loop over the bridge" --maxWorkers=1
          npx vitest run test/mcp.test.ts -t "uses Codex response and session semantics for quick and interactive commands" --maxWorkers=1
      - name: Commit patch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/mcp/tools-core.ts test/bridge.test.ts test/mcp.test.ts test/session.test.ts
          git diff --cached --quiet || git commit -m "security: enforce OS command sandbox"
          git push origin HEAD:security/hardened-baseline

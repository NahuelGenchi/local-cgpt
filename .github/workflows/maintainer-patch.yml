name: Patch Linux hardened documentation

on:
  push:
    branches: [security/hardened-baseline]
    paths:
      - '.github/workflows/maintainer-patch.yml'

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: security/hardened-baseline
          persist-credentials: true

      - name: Patch inherited documentation
        shell: python
        run: |
          from pathlib import Path
          import re

          readme = Path('README.md')
          text = readme.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one README match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          def replace_between(start, end, replacement):
              global text
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'README start marker missing: {start!r}')
              b = text.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f'README end marker missing: {end!r}')
              text = text[:a] + replacement + text[b:]

          replace_once('<h1>Chat On Steroids</h1>', '<h1>local-cgpt</h1>')
          replace_once(
              '<p>Local files, commands, durable session history, Compact &amp; Resume, experimental worker chats, and optional Windows desktop control over MCP.</p>',
              '<p>A Linux-first, fail-closed local bridge for ChatGPT over MCP.</p>'
          )
          replace_once(
              'Chat On Steroids is a Windows, macOS and Linux desktop app that exposes only the folders and capabilities you configure through a local MCP server. You keep using ChatGPT in the browser. The app is the permission boundary and local executor; the companion Chrome extension adds browser-side chat attribution, session capture, richer tool rows, Compact & Resume, and experimental multi-agent coordination. Screen/mouse/keyboard/clipboard automation remains Windows-only and is omitted from the macOS/Linux product surface.',
              '`local-cgpt` is currently a **Linux-only supported desktop app** that gives ChatGPT a deliberately restricted local MCP bridge. The hardened fork starts with no model-facing capabilities enabled and treats the app plus Linux OS sandbox as the authority boundary. The companion Chrome extension is optional and adds browser-side chat attribution, session capture, Compact & Resume and experimental worker coordination only when you explicitly enable the features that need it. Windows/macOS code inherited from upstream is not a current product target.'
          )

          replace_between(
              '## Download\n',
              '## What it adds\n',
              '''## Current test status\n\n**There is not yet a hardened release artifact that should be treated as ready for normal use.** The current supported target is Linux. Until M0 is complete, use only disposable/non-sensitive project data and do not treat inherited/upstream installers as the hardened fork.\n\nThe first supported hands-on test gate is:\n\n- final-head Linux CI is green;\n- the Security workflow is green;\n- the exact production Bubblewrap profile is verified on a representative Linux machine, including approved-root containment and network denial;\n- README/security documentation matches the implemented boundary; and\n- the tested source/artifact revision is identified explicitly.\n\n### M0 fail-closed defaults\n\nFresh hardened installations start with **all model-facing capabilities disabled** and **read-only mode enabled**. Session recording, automatic compaction, multi-agent mode and Goal mode are also disabled.\n\nWhen command execution is explicitly granted on Linux, it requires Bubblewrap. Approved project roots are the only writable host mounts, system runtime paths are read-only, HOME/TMP/XDG state is private, credential-like ambient environment variables are removed, and the production command profile does not share the host network namespace. If Bubblewrap cannot establish the boundary, the requested command does not run; there is no unrestricted fallback.\n\nUse a narrow project folder rather than your home directory or filesystem root. See [Permissions and security boundaries](#permissions-and-security-boundaries), [`SECURITY.md`](SECURITY.md) and [`docs/security-audit.md`](docs/security-audit.md).\n\n'''
          )

          replace_once(
              '| Desktop | **Windows only:** screenshots, window/control inspection, mouse, keyboard and clipboard permissions |',
              '| Desktop | Inherited Windows automation code exists upstream, but it is not part of the current Linux product surface |'
          )
          replace_once(
              'The app has no replacement chat UI and does not host a model. It runs quietly in the system tray/menu bar and bridges ChatGPT to capabilities on the computer you already use.',
              'The app has no replacement chat UI and does not host a model. On the current Linux target it runs as the local permission/execution bridge for the capabilities you explicitly grant.'
          )

          replace_between(
              '## Requirements\n',
              'Use a normal ChatGPT conversation',
              '''## Requirements\n\n- A modern desktop **Linux** distribution on x64 or ARM64. M0 CI currently gates on Ubuntu 24.04 x64; broader distribution compatibility is hardened further in M1.\n- **Bubblewrap (`bwrap`)** for command execution. On Debian/Ubuntu install the `bubblewrap` package. If it is unavailable or incompatible, command execution remains unavailable rather than falling back unsandboxed.\n- A working Secret Service/keyring backend such as GNOME Keyring or KWallet when storing API keys or using the companion extension. Electron's unencrypted `basic_text` fallback is deliberately refused.\n- **Chrome 116+** only if you want browser attribution, Compact & Resume, Overwrite or worker chats.\n- A ChatGPT workspace where Developer mode/custom MCP apps are available for the capabilities you intend to use.\n\n'''
          )
          replace_once('Chat On Steroids\' experimental worker chats', '`local-cgpt`\'s experimental worker chats')
          replace_once('1. Install the build for your CPU and open Chat On Steroids.', '1. On Linux, build/run the reviewed hardened revision or use the explicitly identified M0 test artifact once one is published.')
          replace_once(
              '4. In ChatGPT on the web, enable Developer mode and create the Core app. On Windows, create the Desktop app too if you enabled screen/control/clipboard permissions. Your workspace admin may need to grant or enable Developer mode first.',
              '4. In ChatGPT on the web, enable Developer mode and create the Core app. Your workspace admin may need to grant or enable Developer mode first.'
          )
          replace_once('5. In Chat On Steroids, press **Open extension folder**.', '5. In `local-cgpt`, press **Open extension folder**.')
          replace_once(
              'For OpenAI tunnels, Core and the optional **Windows-only** Desktop surface use separate tunnel IDs because ChatGPT addresses each custom app as one endpoint.',
              'The current Linux-supported product publishes the Core MCP surface only.'
          )

          replace_between(
              '### Unsigned release builds\n',
              '## Permissions and security boundaries\n',
              '''### Hardened test artifacts\n\nDo not use an inherited/upstream release binary as evidence that the hardened fork is running. Until the M0 test artifact is explicitly identified, build from the reviewed `security/hardened-baseline` revision only for disposable testing. Stronger release provenance, checksums/SBOM policy and publisher signing are roadmap M4 work.\n\n'''
          )

          replace_between(
              '## Permissions and security boundaries\n',
              '## Connectors and tools\n',
              '''## Permissions and security boundaries\n\nFresh hardened installs start with **all model-facing capabilities disabled**, **read-only mode enabled**, and data-expanding features (session recording, automatic compaction, multi-agent and Goal) disabled. Existing explicit stored choices are preserved unless a security migration requires otherwise.\n\nThe important boundaries are:\n\n- **File tools are limited to approved folders.** Paths are canonicalized before access. These application-level checks remain defense in depth around command isolation.\n- **Commands are Linux-only in the current supported product and are OS-sandboxed when enabled.** `exec_command` is launched through Bubblewrap, not directly as an unrestricted shell. Approved roots are the only writable host mounts; system runtime paths are read-only; HOME/TMP/XDG are private; the child environment is rebuilt; and the production profile does not share the host network namespace.\n- **Command setup fails closed.** If Bubblewrap is missing, the working directory is outside an approved root, or namespace setup fails, the requested command does not execute.\n- **Ambient credentials are not inherited by generic model-run child processes.** Common token/key/password/client-secret variables and credential-helper sockets/pointers are stripped. This is additional defense in depth, not permission to expose unrelated host files.\n- **The MCP server is loopback-only.** A random secret path protects each local connector. ChatGPT reaches it through the tunnel you configure; treat any complete public tunnel URL as a secret.\n- **Secrets use Electron `safeStorage`.** On Linux the app refuses Electron's unencrypted `basic_text` fallback, so a secure keyring/Secret Service backend is required for stored secrets.\n- **The browser bridge is separate and loopback-only.** It exists for the companion extension and exposes no filesystem, command or settings-mutation route. The extension can observe ChatGPT page content on its narrow ChatGPT-origin allowlist when explicitly used, so recording/workers/Goal remain off by default.\n\nRead-only mode remains the fast kill switch for local mutation. See [`SECURITY.md`](SECURITY.md) for the supported threat boundary and first-test gate.\n\n'''
          )

          replace_between(
              '## Connectors and tools\n',
              '## Session recording and the extension\n',
              '''## Connectors and tools\n\nThe current Linux-supported product exposes the **Core** MCP surface only. Windows Desktop automation code remains inherited source, not a supported current connector.\n\n| Connector | Purpose | Possible tool names |\n| --- | --- | --- |\n| **Core** | Approved files, search, patches, sandboxed terminal, session lookup and optional workers | `read`, `view_image`, `find`, `apply_patch`, `exec_command`, `write_stdin`, `session`, `agents` |\n\nCore declares eight possible names but exposes only the capabilities currently granted; `find` and the command pair are mutually exclusive. Revoking a permission takes effect at live enforcement even if ChatGPT still displays a previously cached schema. Refresh/review the custom app and start a new chat after changing exposed capability shape.\n\nThe public tool contract and permission mapping live in [`docs/tool-surface.md`](docs/tool-surface.md).\n\n'''
          )

          replace_once(
              'Session recording is **on by default for new installs** and can be disabled. It stores the local history needed for the Chat timeline and `session` lookup under the app\'s per-user data directory: `%APPDATA%\\chat-on-steroids\\sessions\\` on Windows, `~/Library/Application Support/chat-on-steroids/sessions/` on macOS, and `${XDG_CONFIG_HOME:-~/.config}/chat-on-steroids/sessions/` on Linux. The small Activity log is separate, capped, redacted and memory-only. Session retention defaults to 30 days.',
              'Session recording is **off by default for fresh hardened installs**. If you explicitly enable it, detailed conversation/tool history is stored under the app\'s Linux per-user data directory and is not encrypted by `safeStorage`; treat it as sensitive local data. The small Activity log is separate, capped, redacted and memory-only. Session retention remains bounded by the configured retention policy.'
          )
          replace_once(
              'For long recorded sessions, the app estimates context pressure locally. Fresh installs warn around **400k estimated tokens**, use **533k** as the limit marker, and enable automatic compaction at 400k. These are local estimates, not ChatGPT\'s private context counter.',
              'For long recorded sessions, the app estimates context pressure locally. The warning/limit thresholds remain available, but **automatic compaction is off by default** in the hardened baseline and must be explicitly enabled. These are local estimates, not ChatGPT\'s private context counter.'
          )
          replace_once(
              'Fresh installs currently enable multi-agent mode with **two workers** by default; the hard maximum is eight. One prime chat can open worker chats and exchange brokered messages with them. Workers cannot message each other directly.',
              'Multi-agent mode is **off by default** in fresh hardened installs. If explicitly enabled, one prime chat can open worker chats and exchange brokered messages with them; the configured worker limit remains bounded and workers cannot message each other directly.'
          )

          replace_between(
              '## Building\n',
              '## Licence\n',
              '''## Building\n\nCurrent supported packaging is Linux-only:\n\n```sh\nnpm run dist:linux:x64\nnpm run dist:linux:arm64\n```\n\nFor the first hardened test, prefer the Debian package on Debian/Ubuntu once the M0 artifact is explicitly identified. Do not treat inherited Windows/macOS packaging or an upstream release as a supported `local-cgpt` build. M1 owns broader Linux packaging/sandbox compatibility and M4 owns stronger release provenance/signing.\n\n'''
          )

          readme.write_text(text)

          agents = Path('AGENTS.md')
          agent_text = agents.read_text()
          old_intro = '''A **Windows/macOS/Linux Electron app** that hands ChatGPT a deliberately small set of local\ncomputer capabilities over MCP. It is a bridge and a permission layer — not a chat client,\nnot a model host. It also ships a Chrome extension that watches ChatGPT itself, so the app can\nrecord conversations, prove which conversation issued which tool call, replace generic tool\nrows with what actually happened, compact a long chat into a fresh one, and run worker chats.\nCore is portable; the Desktop/computer-use surface is deliberately Windows-only and must be\nabsent from live macOS/Linux capability/discovery state.'''
          new_intro = '''A **Linux-supported Electron app** that hands ChatGPT a deliberately small set of local\ncomputer capabilities over MCP. It is a bridge and a permission layer — not a chat client,\nnot a model host. It also ships an optional Chrome extension that can observe ChatGPT itself\nfor conversation attribution, session capture, Compact & Resume and worker coordination when\nthose features are explicitly enabled. The inherited codebase still contains Windows/macOS\npaths and Windows Desktop automation, but Linux is the only current product/release target;\nunsupported-platform behavior must never weaken the Linux security model.'''
          if agent_text.count(old_intro) != 1:
              raise SystemExit('AGENTS intro contract changed unexpectedly')
          agent_text = agent_text.replace(old_intro, new_intro, 1)

          pattern = re.compile(r'Fresh-install defaults from `config\.ts` — .*?choices so a config moved back to Windows does not lose them\.', re.S)
          replacement = '''Fresh-install defaults from `config.ts` are security-first: **all model-facing capabilities off**,\n**read-only on**, **recording off**, **automatic compaction off**, **multi-agent off**, and\n**Goal off**. Existing explicit stored choices are preserved by migration. Linux is the only\ncurrent supported product target. When command execution is granted on Linux it must pass through\nthe Bubblewrap sandbox; there is no unrestricted command fallback when the backend cannot establish\nthe boundary. Windows/macOS code may remain inherited, but platform-specific behavior there is not\nan M0 release condition.'''
          agent_text, count = pattern.subn(replacement, agent_text, count=1)
          if count != 1:
              raise SystemExit(f'AGENTS fresh-default paragraph match count: {count}')
          agents.write_text(agent_text)

      - name: Commit documentation corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md
          git diff --cached --check
          git diff --cached --quiet || git commit -m "docs: make hardened fork Linux-first"
          git push origin HEAD:security/hardened-baseline

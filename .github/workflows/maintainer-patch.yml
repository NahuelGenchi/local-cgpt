name: Maintainer patch

on:
  push:
    branches:
      - security/hardened-baseline
    paths:
      - .github/workflows/maintainer-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: security/hardened-baseline
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Patch feature fixtures
        shell: python
        run: |
          from pathlib import Path

          bridge = Path('test/bridge.test.ts')
          text = bridge.read_text()
          old = """      sessions: { ...defaultConfig().sessions, record: true },\n      goal: { ...defaultConfig().goal, enabled: true, model: 'deepseek/deepseek-v4-flash', reasoning: 'default' }"""
          new = """      sessions: { ...defaultConfig().sessions, record: true },\n      multiAgent: { ...defaultConfig().multiAgent, enabled: true, maxWorkers: 3 },\n      goal: { ...defaultConfig().goal, enabled: true, model: 'deepseek/deepseek-v4-flash', reasoning: 'default' }"""
          if text.count(old) != 1:
              raise SystemExit(f'bridge Goal setup match count={text.count(old)}')
          bridge.write_text(text.replace(old, new, 1))

          mcp = Path('test/mcp.test.ts')
          text = mcp.read_text()
          old = """    expect(textOf(second)).not.toContain('first=raw-no-newline');\n  });\n\n  it('runs in workdir and omits the old connector-specific cwd header'"""
          new = """    expect(textOf(second)).not.toContain('first=raw-no-newline');\n  }, 30_000);\n\n  it('runs in workdir and omits the old connector-specific cwd header'"""
          if text.count(old) != 1:
              raise SystemExit(f'mcp timeout anchor count={text.count(old)}')
          mcp.write_text(text.replace(old, new, 1))

          session = Path('test/session.test.ts')
          text = session.read_text()
          old = """    expect(call?.attributionMethod).toBe('unattributed');\n    expect(call?.conversationId).toBeNull();\n  });\n\n  /**\n   * A disagreement is a bad moment, not a bad request id."""
          new = """    expect(call?.attributionMethod).toBe('unattributed');\n    expect(call?.conversationId).toBeNull();\n  }, 15_000);\n\n  /**\n   * A disagreement is a bad moment, not a bad request id."""
          if text.count(old) != 1:
              raise SystemExit(f'session timeout anchor count={text.count(old)}')
          session.write_text(text.replace(old, new, 1))
      - name: Install dependencies
        run: npm ci
      - name: Stage ripgrep
        run: npm run rg
      - name: Validate patched fixtures
        run: |
          npm run typecheck
          npx vitest run test/bridge.test.ts -t "the goal loop over the bridge" --maxWorkers=1
          npx vitest run test/mcp.test.ts -t "uses Codex response and session semantics for quick and interactive commands" --maxWorkers=1
          npx vitest run test/session.test.ts -t "rejects URL/Fiber conversation conflicts instead of choosing either identity" --maxWorkers=1
      - name: Commit patch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/bridge.test.ts test/mcp.test.ts test/session.test.ts
          git commit -m "test: make opt-in fixtures explicit"
          git push origin HEAD:security/hardened-baseline

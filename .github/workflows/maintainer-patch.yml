name: Isolate hardened fork application state

on:
  workflow_dispatch:
  push:
    branches: [security/hardened-baseline]
    paths:
      - '.github/workflows/maintainer-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: security/hardened-baseline
          persist-credentials: true

      - name: Bind Electron state to the hardened fork
        shell: python
        run: |
          from pathlib import Path

          index = Path('src/main/index.ts')
          text = index.read_text()
          old = "import { trustedDevelopmentRendererUrl } from './renderer-security.js';\n"
          new = old + "import { hardenedUserDataPath } from './app-identity.js';\n"
          if text.count(old) != 1:
              raise SystemExit('renderer-security import anchor changed')
          text = text.replace(old, new, 1)

          anchor = "/** Durable state file holding the multi-agent run. Hashes only, never credentials. */\n"
          insert = """// The fork must never inherit upstream permissions, recordings, browser state or secret metadata\n// merely because Electron's inherited application identity would otherwise reuse the same path.\n// Set this before the single-instance lock and before any config/secret/session initialization.\napp.setPath('userData', hardenedUserDataPath(app.getPath('appData')));\n\n"""
          if text.count(anchor) != 1:
              raise SystemExit('state initialization anchor changed')
          index.write_text(text.replace(anchor, insert + anchor, 1))

      - name: Validate and commit
        run: |
          npm ci
          npx vitest run test/app-identity.test.ts test/renderer-security.test.ts
          npm run typecheck
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/index.ts
          git diff --cached --quiet || git commit -m "security: isolate fork runtime state"
          git push origin HEAD:security/hardened-baseline

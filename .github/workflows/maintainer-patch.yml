name: Remove upstream extension download path

on:
  workflow_dispatch:
  push:
    branches: [security/hardened-baseline]
    paths:
      - '.github/workflows/maintainer-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: security/hardened-baseline
          persist-credentials: true

      - name: Remove upstream extension recovery download
        shell: python
        run: |
          from pathlib import Path

          version = Path('src/main/version.ts')
          text = version.read_text()
          old = '''/**
 * Standalone extension recovery must stay on the app's own release. Using GitHub's moving
 * `latest` asset can pair an older installed app with a newer, incompatible bridge protocol.
 */
export function extensionDownloadUrl(version = APP_VERSION): string {
  return `https://github.com/totec448-spec/chat-on-steroids/releases/download/v${encodeURIComponent(version)}/Chat-On-Steroids-Extension.zip`;
}

'''
          if text.count(old) != 1:
              raise SystemExit('version extension download block changed')
          version.write_text(text.replace(old, '', 1))

          ipc = Path('src/main/ipc.ts')
          text = ipc.read_text()
          old = "import { extensionDownloadUrl } from './version.js';\n"
          if text.count(old) != 1:
              raise SystemExit('ipc extensionDownloadUrl import changed')
          text = text.replace(old, '', 1)
          old = '''  handle('bridge:downloadExtension', async () => {
    // This is a recovery path for the extension bundled with *this installed app*. Never use
    // releases/latest here: an old app must not fetch a newer extension with a newer protocol.
    await shell.openExternal(extensionDownloadUrl(app.getVersion()));
    return true;
  });

'''
          if text.count(old) != 1:
              raise SystemExit('ipc extension download handler changed')
          ipc.write_text(text.replace(old, '', 1))

          preload = Path('src/preload/index.ts')
          text = preload.read_text()
          old = "  downloadExtension: () => call<boolean>('bridge:downloadExtension'),\n"
          if text.count(old) != 1:
              raise SystemExit('preload extension download API changed')
          preload.write_text(text.replace(old, '', 1))

          renderer = Path('src/renderer/main.ts')
          text = renderer.read_text()
          old = "$('bridgeDownload').addEventListener('click', () => void run(api.downloadExtension()));\n\n"
          if text.count(old) != 1:
              raise SystemExit('renderer extension download listener changed')
          renderer.write_text(text.replace(old, '', 1))

          html = Path('src/renderer/index.html')
          text = html.read_text()
          old = '''                    <button
                      class="btn"
                      id="bridgeDownload"
                      type="button"
                    >
                      <svg class="ico" viewBox="0 0 24 24"><use href="#i-out" /></svg>Download extension ZIP
                    </button>
'''
          if text.count(old) != 1:
              raise SystemExit('renderer extension download button changed')
          text = text.replace(old, '', 1)
          old = '''                    Open <code>chrome://extensions</code>, turn on <strong>Developer mode</strong>,
                    choose <strong>Load unpacked</strong> and pick the folder the button opens. It
                    pairs with this app by itself — there is no code to type.
'''
          new = '''                    Open <code>chrome://extensions</code>, turn on <strong>Developer mode</strong>,
                    choose <strong>Load unpacked</strong> and pick the bundled folder the button opens.
                    The hardened baseline does not download extension code from upstream releases.
                    It pairs with this app by itself — there is no code to type.
'''
          if text.count(old) != 1:
              raise SystemExit('renderer extension instructions changed')
          html.write_text(text.replace(old, new, 1))

          audit = Path('docs/security-audit.md')
          text = audit.read_text()
          anchor = '### HIGH — browser extension can observe ChatGPT page content\n'
          addition = '''### HIGH — extension recovery could reintroduce unreviewed upstream browser code\n\n**Status: MITIGATED in the hardened baseline.**\n\nThe inherited app exposed a recovery button whose URL fetched the matching extension ZIP from the upstream `totec448-spec/chat-on-steroids` release. That defeats the fork's review boundary even when the version is pinned: the browser code would come from a different publisher/repository than the reviewed hardened source.\n\nM0 removes the remote extension-download IPC/preload/renderer path entirely. If the optional extension is used, Chrome must load the extension directory bundled with the reviewed app/source. Public remote extension distribution remains deferred until this fork has its own release provenance policy. Security CI rejects reintroduction of the upstream release-download URL in runtime source.\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('audit browser extension anchor changed')
          audit.write_text(text.replace(anchor, addition + anchor, 1))

          security = Path('SECURITY.md')
          text = security.read_text()
          anchor = '- The companion-extension bridge is a separate loopback service and exposes no filesystem, command or settings-mutation route.\n'
          replacement = anchor + '- The optional Chrome extension must come from the extension directory bundled with the reviewed hardened app/source. M0 exposes no runtime path that downloads an extension ZIP from the upstream project.\n'
          if text.count(anchor) != 1:
              raise SystemExit('SECURITY extension boundary anchor changed')
          security.write_text(text.replace(anchor, replacement, 1))

      - name: Validate and commit
        run: |
          npm ci
          npm run typecheck
          npx vitest run test/renderer-security.test.ts test/app-identity.test.ts
          if grep -R -F 'totec448-spec/chat-on-steroids/releases/download' src/main src/preload src/renderer; then
            echo 'Runtime source still references the upstream extension release download path' >&2
            exit 1
          fi
          if grep -R -F 'bridge:downloadExtension' src/main src/preload src/renderer; then
            echo 'Remote extension-download IPC surface still exists' >&2
            exit 1
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/version.ts src/main/ipc.ts src/preload/index.ts src/renderer/main.ts src/renderer/index.html docs/security-audit.md SECURITY.md
          git diff --cached --quiet || git commit -m "security: remove upstream extension download path"
          git push origin HEAD:security/hardened-baseline
